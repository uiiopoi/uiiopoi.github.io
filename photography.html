<style>
:root{
  --bg:#0b0d10; --bg-2:#13161b; --ink:#f1efe9; --ink-2:#c4c1b8; --muted:#8a877f; --line:#24272e; --accent:#f2b33d;
  --serif:"Fraunces","Noto Serif SC",Georgia,serif; --sans:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
[data-lang="en"] [lang="zh"]{display:none!important}
[data-lang="zh"] [lang="en"]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:0 32px}

nav{position:fixed;top:0;left:0;right:0;z-index:30;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
nav.solid{background:rgba(11,13,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.back{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;font-size:14px;color:var(--ink-2)}
.back b{font-family:var(--serif);font-size:21px;color:var(--ink);letter-spacing:-.02em}
.back b span{color:var(--accent)}
.back:hover{color:var(--ink)}
.btn-ghost{font:500 13px var(--sans);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);border-radius:999px;height:34px;padding:0 14px;cursor:pointer}
.btn-ghost .on{color:var(--accent);font-weight:700}

/* hero */
.hero{position:relative;height:92vh;min-height:520px;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:settle 2.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes settle{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.45) 0%,rgba(11,13,16,0) 30%,rgba(11,13,16,.15) 55%,var(--bg) 100%)}
.hero-txt{position:relative;z-index:2;padding-bottom:64px;width:100%}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(52px,9vw,128px);line-height:.95;letter-spacing:-.04em}
h1 i{font-style:italic;color:var(--ink-2)}
.hero-sub{margin-top:20px;max-width:36em;color:var(--ink-2);font-size:17px}
.hero-meta{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* series index */
.index{position:sticky;top:64px;z-index:20;background:rgba(11,13,16,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.index .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:12px}
.index .wrap::-webkit-scrollbar{display:none}
.index a{flex:none;text-decoration:none;font-size:13.5px;padding:7px 14px;border-radius:999px;color:var(--ink-2);border:1px solid var(--line);transition:all .2s;white-space:nowrap}
.index a:hover,.index a.active{color:#0b0d10;background:var(--ink);border-color:var(--ink)}
.index a small{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:6px}

/* series */
.series{padding:72px 0 0}
.series+.series{margin-top:56px}
.series+.series .wrap{border-top:1px solid var(--line);padding-top:72px}
.s-head{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:20px;margin-bottom:28px}
.s-num{font-family:var(--mono);font-size:13px;color:var(--accent);padding-bottom:10px}
.s-title{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,60px);letter-spacing:-.03em;line-height:1}
.s-meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;padding-bottom:8px;white-space:nowrap}
.grid{columns:3 320px;column-gap:14px}
.ph{break-inside:avoid;margin-bottom:14px;position:relative;cursor:zoom-in;overflow:hidden;border-radius:4px;background:var(--bg-2);display:block;width:100%;border:0;padding:0}
.ph img{display:block;width:100%;height:auto;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .6s;opacity:0}
.ph img.ld{opacity:1}
.ph:hover img{transform:scale(1.035)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;font-family:var(--mono);font-size:11px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transform:translateY(6px);transition:all .3s;text-align:left}
.ph:hover .cap,.ph:focus-visible .cap{opacity:1;transform:none}
.ph:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,6,8,.96);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.lb.open{display:flex}
.lb.show{opacity:1}
.lb figure{max-width:94vw;max-height:88vh;display:flex;flex-direction:column;align-items:center}
.lb img{max-width:94vw;max-height:82vh;object-fit:contain;display:block;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb figcaption{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.lb figcaption b{color:var(--ink-2);font-weight:500}
.lb button{position:absolute;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;width:48px;height:48px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb button:hover{background:rgba(255,255,255,.16)}
.lb .x{top:18px;right:18px}
.lb .pv{left:18px;top:50%;transform:translateY(-50%)}
.lb .nx{right:18px;top:50%;transform:translateY(-50%)}
.lb svg{width:20px;height:20px}

footer{border-top:1px solid var(--line);margin-top:80px;padding:40px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--ink-2)}

@media (max-width:700px){
  .wrap{padding:0 16px}
  .grid{columns:2 150px;column-gap:8px}
  .ph{margin-bottom:8px}
  .s-head{grid-template-columns:1fr;gap:6px}
  .s-num{padding:0}.s-meta{text-align:left;padding:0}
  .series{padding:64px 0 12px}
  .lb .pv,.lb .nx{top:auto;bottom:22px;transform:none}
  .hero{height:78vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ph img{opacity:1}}
</style>
</head>
